x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://payments:payments@postgres:5432/payments
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
  API_KEY: ${API_KEY:-secret-api-key}
  MAX_ATTEMPTS: "3"
  RETRY_BASE_DELAY: "5"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 3s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"   # management UI: guest / guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *app-env
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  consumer:
    build: .
    command: ["faststream", "run", "app.consumer:app"]
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # Демо-приёмник webhook'ов: /hook -> 200, /fail -> 500 (для проверки retry/DLQ)
  webhook-receiver:
    build: .
    command: ["uvicorn", "tools.webhook_receiver:app", "--host", "0.0.0.0", "--port", "9000"]
    ports:
      - "9000:9000"

volumes:
  pgdata:
  rabbitmq_data:
